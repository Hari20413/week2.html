<!DOCTYPE html>
 <html lang="en">
     <head> 
        <meta charset="UTF-8"> <title>Images</title> 
    </head>
     <body> 
        <h1>Working with Images</h1>
         <img src="logo.png" alt="College Logo" width="200" height="150">
          <figure>
             <img src="campus.jpg" alt="Campus View" width="300"> 
             <figcaption>Our College Campus</figcaption> 
         </figure>
             <p>Image used as a link:</p>
              <a href="https://www.example.com"> <img src="banner.png" alt="Banner" width="250"> </a>
     </body>
</html>
